                  <div className="p-4 bg-[#C5A880] text-black rounded font-bold text-xs">Secondary: #C5A880</div>
                  <div className="p-4 bg-[#424D43] text-white rounded font-bold text-xs">Tertiary: #424D43</div>
                  <div className="p-4 bg-[#FDFBF7] text-black border rounded font-bold text-xs">Canvas: #FDFBF7</div>
                </div>
              </div>
            )}
          </main>

          {/* Footer */}
          <footer className="bg-black text-white py-12 mt-16 border-t border-gray-800">
            <div className="max-w-[1440px] mx-auto px-6 flex flex-col md:flex-row justify-between items-center gap-4 text-xs text-gray-400">
              <p>© 2026 Tanabana Fabrics. Recreated as requested from Stitch Project ID 5671272351440654145.</p>
              <div className="flex gap-4">
                <button onClick={() => setCurrentView('home')}>Home</button>
                <button onClick={() => setCurrentView('collection')}>Collection</button>
                <button onClick={() => setCurrentView('pdp')}>PDP</button>
                <button onClick={() => setCurrentView('design-system')}>Design System</button>
              </div>
            </div>
          </footer>

          {/* Toast */}
          {toast && (
            <div className="fixed bottom-6 right-6 bg-black text-white px-6 py-3 rounded shadow-2xl text-xs font-bold uppercase tracking-wider">
              {toast}
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
